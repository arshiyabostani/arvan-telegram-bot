name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pip-audit
      - run: pip-audit

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: shellcheck -x install.sh tests/installer_smoke.sh tests/installer_modes.sh
      - run: bash tests/installer_smoke.sh
      - name: Hide the runner's own Docker so the test controls it
        run: |
          while p=$(command -v docker); do sudo mv "$p" "$p.off"; done
      - run: sudo env "PATH=$PATH" bash tests/installer_modes.sh
