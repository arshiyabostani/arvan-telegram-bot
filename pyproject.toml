[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arvan-telegram-bot"
version = "1.0.0"
description = "Telegram bot to manage ArvanCloud CDN: DNS records, cloud toggle and cache purge."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "arshiyabostani" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: Name Service (DNS)",
]
dependencies = [
    "python-telegram-bot[socks]>=21.6,<23",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
arvan-bot = "arvan_bot.__main__:main"

[project.urls]
Homepage = "https://github.com/arshiyabostani/arvan-telegram-bot"
Issues = "https://github.com/arshiyabostani/arvan-telegram-bot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/arvan_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests and for invariants

[tool.ruff.lint.per-file-ignores]
# Persian text trips the "ambiguous unicode character" check.
"src/arvan_bot/bot/messages.py" = ["RUF001"]
